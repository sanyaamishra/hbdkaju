<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Happy Birthday, Kaaju Baby 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #caa877;
    --kraft-dark: #a9855a;
    --maroon: #6d1620;
    --maroon-deep: #4a0e14;
    --cream: #fbf3e4;
    --gold: #eab63c;
    --pink: #e79a9a;
    --ink: #3a2417;
    --page-w: min(40vw, 360px);
    --shadow: 0 18px 40px rgba(30,10,5,.45);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at top, rgba(255,235,200,.10), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(25deg, rgba(0,0,0,.035) 0 2px, transparent 2px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.06), transparent 55%),
      linear-gradient(160deg, var(--kraft) 0%, var(--kraft-dark) 100%);
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 9vh 16px 60px;
  }

  .title-note{
    font-family:'Caveat', cursive;
    font-size:clamp(1.1rem, 2.4vw, 1.5rem);
    color:var(--cream);
    text-shadow:0 2px 6px rgba(0,0,0,.4);
    margin: 0 0 22px;
    opacity:.9;
    letter-spacing:.02em;
  }

  .book{
    position:relative;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }

  .page{
    width:var(--page-w);
    aspect-ratio: 1131 / 1600;
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    background:var(--cream);
    position:relative;
    flex-shrink:0;
  }

  /* ---- LEFT PAGE (grows in on open) ---- */
  .page-left{
    width:0;
    opacity:0;
    margin-right:0;
    transition: width .9s cubic-bezier(.22,.9,.24,1), opacity .6s ease .1s, margin-right .9s cubic-bezier(.22,.9,.24,1);
    box-shadow:none;
  }
  .book.open .page-left{
    width:var(--page-w);
    opacity:1;
    margin-right:10px;
    box-shadow:var(--shadow);
  }

  /* ---- FLIP / COVER + RIGHT PAGE ---- */
  .flip-outer{
    width:var(--page-w);
    aspect-ratio: 1131/1600;
    perspective: 2400px;
    flex-shrink:0;
  }
  .flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transform-origin: 50% 50%;
    transition: transform 1s cubic-bezier(.3,.85,.25,1);
    transform: rotateY(0deg);
    cursor:pointer;
  }
  .book.open .flip-inner{
    transform: rotateY(180deg);
    cursor:default;
  }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    background:var(--cream);
  }
  .face-front{ transform: rotateY(0deg); }
  .face-back{ transform: rotateY(180deg); }

  .face-front img{width:100%; height:100%; object-fit:cover; display:block;}

  .tap-hint{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(1rem, 3vw, 1.35rem);
    color:#5a1010;
    background:rgba(255,250,240,.85);
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    animation: bob 1.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes bob{ 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-6px);} }

  /* ---- LETTER PAGE CONTENT ---- */
  .envelope-wrap{position:absolute; inset:0;}
  .envelope-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .letter-card{
    position:absolute;
    left:50%; top:9%;
    width:76%;
    transform: translate(-50%,0) scale(.5) rotate(-3deg);
    transform-origin: top center;
    opacity:0;
    z-index:2;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    cursor:pointer;
    transition: transform .55s cubic-bezier(.25,.9,.25,1), top .55s cubic-bezier(.25,.9,.25,1), opacity .4s ease, box-shadow .3s ease;
  }
  .letter-card img{width:100%; display:block;}
  .page-left.letter-open .letter-card{
    top:7%;
    transform: translate(-50%,0) scale(1) rotate(0deg);
    opacity:1;
    box-shadow:0 20px 44px rgba(0,0,0,.5);
  }
  .letter-hint{
    position:absolute;
    left:50%; bottom:4%;
    transform:translateX(-50%);
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(.95rem, 2.6vw, 1.25rem);
    color:#5a1010;
    background:rgba(255,250,240,.85);
    padding:3px 14px;
    border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    z-index:1;
    transition:opacity .3s ease;
    white-space:nowrap;
  }
  .page-left.letter-open .letter-hint{ opacity:0; }

  /* ---- CANDLES PAGE CONTENT ---- */
  .cake-wrap{position:absolute; inset:0;}
  .cake-wrap img.cake-img{width:100%; height:100%; object-fit:cover; display:block;}
  .flame{
    position:absolute;
    width:6.6%;
    transform-origin:50% 88%;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
    transition: opacity .45s ease, transform .35s ease;
    will-change: transform;
  }
  #flame1{ left:39.0%; top:35.0%; }
  #flame2{ left:54.6%; top:35.0%; }
  .flame.out{ opacity:0; transform: translateY(-6px) scale(.4) !important; }

  .mic-panel{
    position:absolute;
    left:5%; right:5%; bottom:3.5%;
    background:rgba(58,24,23,.76);
    backdrop-filter: blur(2px);
    border-radius:11px;
    padding:7px 8px 8px;
    color:#fdf3e4;
    font-family:'Quicksand', sans-serif;
    z-index:3;
    transition:opacity .3s ease, transform .3s ease;
  }
  .mic-status{
    font-size:clamp(.62rem, 1.7vw, .78rem);
    font-weight:600;
    margin:0 0 5px;
    line-height:1.25;
  }
  .meter{
    width:100%; height:7px;
    background:rgba(255,255,255,.2);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:7px;
  }
  .meter-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--gold), #e2532c);
    border-radius:99px;
    transition:width .08s linear;
  }
  .mic-controls{ display:flex; gap:6px; flex-wrap:wrap; }
  .mic-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(.6rem, 1.6vw, .74rem);
    border:none;
    border-radius:999px;
    padding:6px 11px;
    cursor:pointer;
    background:var(--gold);
    color:#3a1a0a;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    touch-action: manipulation;
  }
  .mic-btn:active, .mic-btn.holding{ background:#f4d375; transform:scale(.96); }
  .mic-btn.secondary{ background:rgba(255,255,255,.18); color:#fdf3e4; }
  .mic-note{
    font-size:clamp(.55rem, 1.5vw, .66rem);
    opacity:.75;
    margin:6px 0 0;
    line-height:1.3;
  }

  /* ---- WISH OVERLAY ---- */
  .wish-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(74,14,20,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
    z-index:5;
    overflow:hidden;
    border-radius:12px;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; }
  .wish-box{
    background:rgba(255,249,238,.95);
    padding: 16px 18px 14px;
    border-radius:14px;
    box-shadow:0 14px 30px rgba(0,0,0,.4);
    max-width:82%;
    transform: scale(.85);
    transition: transform .5s cubic-bezier(.3,1.4,.4,1);
  }
  .wish-overlay.show .wish-box{ transform:scale(1); }
  .wish-title{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(1rem, 3.4vw, 1.3rem);
    color:#7a1010;
    margin:0 0 4px;
  }
  .wish-sub{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(.85rem, 2.6vw, 1.05rem);
    color:#5a1010;
    margin:0 0 10px;
  }
  .relight-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(.65rem, 2vw, .8rem);
    border:none;
    border-radius:999px;
    padding:7px 16px;
    cursor:pointer;
    background:var(--maroon);
    color:#fdf3e4;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }
  .relight-btn:active{ transform:scale(.96); }

  .confetti-piece{
    position:absolute;
    top:-10%;
    width:8px; height:14px;
    opacity:.95;
    border-radius:2px;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    z-index:4;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(420px) rotate(540deg); opacity:0; }
  }

  /* ---- BACK BUTTON ---- */
  .back-btn{
    margin-top:26px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(.75rem, 2vw, .9rem);
    border:2px dashed rgba(255,250,240,.6);
    border-radius:999px;
    padding:8px 20px;
    background:rgba(74,14,20,.35);
    color:var(--cream);
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(-6px);
    transition: opacity .4s ease .3s, transform .4s ease .3s;
  }
  .book.open ~ .back-btn{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .back-btn:hover{ background:rgba(74,14,20,.55); }
  .back-btn:active{ transform:scale(.97); }

  button:focus-visible, .flip-inner:focus-visible{
    outline:3px solid #fff2c2;
    outline-offset:2px;
  }

  @media (max-width: 560px){
    :root{ --page-w: min(44vw, 320px); }
    .stage{ padding-top:6vh; padding-left:8px; padding-right:8px; }
    .book.open .page-left{ margin-right:6px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.3s !important; }
  }
</style>
</head>

            <div class="mic-panel">
              <p class="mic-status" id="micStatus">Tap "enable mic" and blow 🌬️</p>
              <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
              <div class="mic-controls">
                <button class="mic-btn" id="enableMicBtn" type="button">🎤 Enable mic</button>
                <button class="mic-btn secondary" id="holdBtn" type="button">🌬️ Hold to blow</button>
              </div>
              <p class="mic-note">Mic blowing needs this page hosted on https:// — if it doesn't work, hold the button above (or hold spacebar).</p>
            </div>

            <div class="wish-overlay" id="wishOverlay">
              <div class="wish-box">
                <p class="wish-title">make a wish, Kaju 🎂</p>
                <p class="wish-sub">happy 21st, cutie patootie ✨</p>
                <button class="relight-btn" id="relightBtn" type="button">🔥 relight candles</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="back-btn" id="backBtn" type="button">← back to cover</button>
</div>

<script>
(function(){
  const book = document.getElementById('book');
  const flipInner = document.getElementById('flipInner');
  const backBtn = document.getElementById('backBtn');
  const pageLeft = document.getElementById('pageLeft');
  const letterCard = document.getElementById('letterCard');
  const letterHint = document.getElementById('letterHint');

  const flame1 = document.getElementById('flame1');
  const flame2 = document.getElementById('flame2');
  const flames = [flame1, flame2];

  const micStatus = document.getElementById('micStatus');
  const meterFill = document.getElementById('meterFill');
  const enableMicBtn = document.getElementById('enableMicBtn');
  const holdBtn = document.getElementById('holdBtn');
  const wishOverlay = document.getElementById('wishOverlay');
  const relightBtn = document.getElementById('relightBtn');

  let bookOpen = false;

  function openBook(){
    if (bookOpen) return;
    bookOpen = true;
    book.classList.add('open');
  }
  function closeBook(){
    bookOpen = false;
    book.classList.remove('open');
    pageLeft.classList.remove('letter-open');
    resetCandles(true);
  }

  flipInner.addEventListener('click', openBook);
  flipInner.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(); }
  });
  backBtn.addEventListener('click', closeBook);

  function toggleLetter(){
    if(!bookOpen) return;
    pageLeft.classList.toggle('letter-open');
    letterHint.textContent = pageLeft.classList.contains('letter-open') ? '' : '💌 tap to read';
  }
  letterCard.addEventListener('click', toggleLetter);
  letterCard.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleLetter(); }
  });

  /* ---------------- BLOW-OUT-THE-CANDLES LOGIC ---------------- */
  const BLOW_NORM_THRESHOLD = 0.34;   // normalized 0..1 level counted as "blowing"
  const BLOW_HOLD_MS = 500;           // sustained duration needed to extinguish
  const MIC_DIVISOR = 0.22;           // raw rms -> normalized scale factor

  let audioCtx = null, analyser = null, dataArray = null;
  let micActive = false;
  let manualBlow = false;
  let smoothedLevel = 0;
  let blowMs = 0;
  let candlesOut = false;
  let lastTs = null;
  let rafId = null;

  function setMicStatus(text){ micStatus.textContent = text; }

  async function enableMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setMicStatus('Mic not supported in this browser — use hold-to-blow below.');
      return;
    }
    if (!window.isSecureContext){
      setMicStatus('This page needs to be hosted on https:// for mic access. Use hold-to-blow below for now.');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.55;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.fftSize);
      micActive = true;
      enableMicBtn.hidden = true;
      setMicStatus('Listening… blow into your mic 🌬️');
    }catch(err){
      setMicStatus('Mic blocked or unavailable — use hold-to-blow below.');
    }
  }
  enableMicBtn.addEventListener('click', enableMic);

  function getMicRms(){
    if(!analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for(let i=0;i<dataArray.length;i++){
      const v = (dataArray[i]-128)/128;
      sum += v*v;
    }
    return Math.sqrt(sum/dataArray.length);
  }

  function setHold(state){
    manualBlow = state;
    holdBtn.classList.toggle('holding', state);
  }
  holdBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); setHold(true); });
  window.addEventListener('pointerup', ()=> setHold(false));
  holdBtn.addEventListener('pointerleave', ()=> setHold(false));
  holdBtn.addEventListener('contextmenu', (e)=> e.preventDefault());

  document.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' && bookOpen && !candlesOut){
      e.preventDefault();
      setHold(true);
    }
  });
  document.addEventListener('keyup', (e)=>{
    if(e.code === 'Space'){ setHold(false); }
  });

  function updateFlameVisual(level, ts){
    flames.forEach((f, i)=>{
      const jitter = Math.sin(ts/70 + i*3) * 3;
      const angle = (level * 48) + jitter * (0.3 + level);
      const shiftX = level * 9;
      const scaleY = 1 - level*0.22;
      f.style.transform = `translateX(${shiftX}px) rotate(${angle}deg) scaleY(${scaleY})`;
    });
  }

  function extinguish(){
    candlesOut = true;
    flames.forEach(f => f.classList.add('out'));
    setTimeout(()=>{
      wishOverlay.classList.add('show');
      burstConfetti();
    }, 450);
  }

  function resetCandles(silent){
    candlesOut = false;
    blowMs = 0;
    smoothedLevel = 0;
    flames.forEach(f => { f.classList.remove('out'); f.style.transform = 'rotate(0deg) scaleY(1)'; });
    wishOverlay.classList.remove('show');
    clearConfetti();
  }
  relightBtn.addEventListener('click', ()=> resetCandles(false));

  const confettiColors = ['#e2532c','#eab63c','#e79a9a','#7a1010','#f4d375','#c9a877'];
  let confettiTimeouts = [];
  function burstConfetti(){
    clearConfetti();
    const count = 34;
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*94 + 2) + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      const dur = 1.4 + Math.random()*1.3;
      const delay = Math.random()*0.5;
      piece.style.animationDuration = dur + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.width = (5 + Math.random()*5) + 'px';
      piece.style.height = (9 + Math.random()*7) + 'px';
      wishOverlay.appendChild(piece);
      const t = setTimeout(()=> piece.remove(), (dur+delay)*1000 + 200);
      confettiTimeouts.push(t);
    }
  }
  function clearConfetti(){
    confettiTimeouts.forEach(t => clearTimeout(t));
    confettiTimeouts = [];
    wishOverlay.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  }

  function loop(ts){
    rafId = requestAnimationFrame(loop);
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(ts - lastTs, 64);
    lastTs = ts;

    if(!bookOpen || candlesOut){
      meterFill.style.width = '0%';
      return;
    }

    let rawLevel = 0;
    if(manualBlow){
      rawLevel = 1;
    } else if(micActive){
      const rms = getMicRms();
      rawLevel = Math.min(1, rms / MIC_DIVISOR);
    }

    smoothedLevel = smoothedLevel*0.72 + rawLevel*0.28;
    meterFill.style.width = Math.round(smoothedLevel*100) + '%';
    updateFlameVisual(smoothedLevel, ts);

    if(smoothedLevel > BLOW_NORM_THRESHOLD){
      blowMs += dt;
    } else {
      blowMs = Math.max(0, blowMs - dt*1.6);
    }

    if(blowMs >= BLOW_HOLD_MS){
      extinguish();
    }
  }
  rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
